version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: fido_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fido_db
      POSTGRES_USER: fido_user
      POSTGRES_PASSWORD: fido_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d fido_db -U fido_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: