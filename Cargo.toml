[package]
name = "fido2-webauthn-server"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web framework
actix-web = "4.4"
actix-cors = "0.6"

# WebAuthn library
webauthn-rs = { version = "0.5", features = ["danger-allow-state-serialisation"] }

# Database
diesel = { version = "2.1", features = ["postgres", "uuid", "chrono", "serde_json"] }
diesel-async = { version = "0.4", features = ["postgres", "deadpool"] }

# Async runtime
tokio = { version = "1.34", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# UUID support
uuid = { version = "1.6", features = ["v4", "serde"] }

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Base64 encoding  
base64 = "0.21"

# URL parsing
url = "2.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Environment variables
dotenvy = "0.15"

# Logging
env_logger = "0.10"
log = "0.4"

# Async traits
async-trait = "0.1"

# Database connection pooling
deadpool-diesel = { version = "0.5", features = ["postgres", "rt_tokio_1"] }

# Configuration
config = "0.13"

# Cryptographic operations
rand = "0.8"

# HTTP client for testing
reqwest = { version = "0.11", optional = true }

[dev-dependencies]
reqwest = { version = "0.11", features = ["json"] }