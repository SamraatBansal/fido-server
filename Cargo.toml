[package]
name = "fido2-relying-party"
version = "0.1.0"
edition = "2021"
authors = ["FIDO2 Security Team"]
description = "A secure FIDO2/WebAuthn Relying Party Server implementation in Rust"
license = "MIT"

[dependencies]
# WebAuthn Core
webauthn-rs = "0.5"

# Async Runtime
tokio = { version = "1.0", features = ["full"] }

# Web Framework
axum = { version = "0.7", features = ["tokio", "json"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "timeout", "compression"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
sqlx = { version = "0.7", features = [
    "postgres", 
    "runtime-tokio-rustls", 
    "uuid", 
    "time", 
    "json", 
    "migrate"
] }

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
base64 = "0.21"
url = "2.4"
time = { version = "0.3", features = ["serde", "formatting"] }

# Security & Crypto
rand = "0.8"
ring = "0.17"

# Configuration
config = "0.13"
dotenvy = "0.15"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-opentelemetry = "0.21"

# Error Handling
anyhow = "1.0"
thiserror = "1.0"

# HTTP Client (for testing)
reqwest = { version = "0.11", features = ["json"], optional = true }

[dev-dependencies]
tokio-test = "0.4"
reqwest = { version = "0.11", features = ["json"] }
testcontainers = "0.15"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1.0"
wiremock = "0.5"

[features]
default = []
testing = ["reqwest"]

[[bin]]
name = "fido2-server"
path = "src/main.rs"

[[bench]]
name = "webauthn_benchmarks"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
overflow-checks = true